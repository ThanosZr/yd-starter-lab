.diagram-pane{border-color:#3a6077;box-shadow:0 0 0 1px #41627b25,0 18px 35px #0004}

.machine-wire:hover>path:nth-child(2){filter:drop-shadow(0 0 6px #81ddff);stroke-width:5}
.machine-wire-selected>path:nth-child(2){filter:drop-shadow(0 0 8px #ffd785)}
.machine-pinname{font-size:15px;fill:#ecf6ff;font-weight:850;pointer-events:none}
.machine-netname{font-size:10px;fill:#7fa6b9;font-weight:650;pointer-events:none}
.machine-section{font-size:15px;font-weight:850;fill:#d6eaf8;letter-spacing:.04em}
.machine-section-small{font-size:9px;font-weight:750;fill:#8eb0c3;letter-spacing:.06em}
.motor-title{fill:#e7f7ff;font-size:21px;font-weight:900;letter-spacing:.06em}
.motor-sub{fill:#8fbecb;font-size:11px;font-weight:800;letter-spacing:.08em}
.motor-symbol{font-size:22px;fill:#caf4fc;font-weight:900}
.coil-tag{font-size:13px;fill:#e7f6fa;font-weight:850;letter-spacing:.04em}
.coil-reading{font-size:14px;fill:#a8d4e9;font-weight:900}

 {id:'vb',label:'v_b · τάση L2',unit:'V',three:true}, {id:'ib',label:'i_b · ρεύμα L2',unit:'A',three:true},
 {id:'vc',label:'v_c · τάση L3',unit:'V',three:true}, {id:'ic',label:'i_c · ρεύμα L3',unit:'A',three:true},
 {id:'pl',label:'p_L · ισχύς πηνίου',unit:'W'}, {id:'pdc',label:'p_d · στιγμιαία DC ισχύς',unit:'W'}, {id:'psrc',label:'p_in · ολική ισχύς εισόδου',unit:'W'},
